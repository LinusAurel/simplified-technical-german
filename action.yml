name: STG-DE Lint
description: Run deterministic Simplified Technical German checks in CI.
inputs:
  paths:
    description: Space-separated files or directories to lint.
    required: false
    default: "."
  profile:
    description: Optional STG-DE application profile.
    required: false
    default: ""
  project:
    description: Optional path to .stg-de.yaml.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install STG-DE
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Run STG-DE lint
      shell: bash
      env:
        STG_PATHS: ${{ inputs.paths }}
        STG_PROFILE: ${{ inputs.profile }}
        STG_PROJECT: ${{ inputs.project }}
      run: |
        args=(lint --fail-on-error)
        if [[ -n "$STG_PROFILE" ]]; then args+=(--profile "$STG_PROFILE"); fi
        if [[ -n "$STG_PROJECT" ]]; then args+=(--project "$STG_PROJECT"); fi
        read -r -a paths <<< "$STG_PATHS"
        stg "${args[@]}" "${paths[@]}"
branding:
  icon: check-circle
  color: blue
