name: STG-DE lint
description: Check German Markdown and text files against STG-DE (Simplified Technical German) and annotate findings in pull requests.
author: LinusAurel
branding:
  icon: check-square
  color: blue
inputs:
  paths:
    description: Space-separated files or directories to check.
    required: false
    default: "."
  profile:
    description: "Application profile: procedure, safety, description, requirement, support, consumer, or agent. Empty uses the base rules."
    required: false
    default: ""
  fail-on:
    description: "Lowest severity that fails the step: error, warning, review, or never."
    required: false
    default: error
  project:
    description: Path to a project terminology file. Default is ./.stg-de.yaml when it exists.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet "PyYAML>=6"
    - shell: bash
      env:
        STG_PATHS: ${{ inputs.paths }}
        STG_PROFILE: ${{ inputs.profile }}
        STG_FAIL_ON: ${{ inputs.fail-on }}
        STG_PROJECT: ${{ inputs.project }}
      run: |
        args=(--root "$GITHUB_ACTION_PATH" --format github --fail-on "$STG_FAIL_ON")
        [ -n "$STG_PROFILE" ] && args+=(--profile "$STG_PROFILE")
        [ -n "$STG_PROJECT" ] && args+=(--project "$STG_PROJECT")
        read -r -a paths <<< "$STG_PATHS"
        python "$GITHUB_ACTION_PATH/tools/stg_lint.py" "${paths[@]}" "${args[@]}"
