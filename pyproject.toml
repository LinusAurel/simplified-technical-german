[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stg-de"
version = "0.4.0"
description = "Simplified Technical German controlled-language tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "STG-DE contributors"}]
keywords = ["controlled-language", "german", "technical-writing", "terminology", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: German",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/LinusAurel/simplified-technical-german"
Issues = "https://github.com/LinusAurel/simplified-technical-german/issues"

[project.scripts]
stg = "stg_de.cli:main"

[tool.setuptools]
packages = ["stg_de"]

[tool.setuptools.package-data]
stg_de = ["dictionary/*.yaml", "profiles/*.yaml"]
