validator_changes:
- id: V04-VAL-01
  change: Declared noun plurals are controlled inflections instead of unknown/capitalized-term candidates.
  observed_public_tokens: 26
- id: V04-VAL-02
  change: Unknown capitalized German words are routed to LEXICAL_NOUN_CANDIDATE, not presumed technical terms.
- id: V04-VAL-03
  change: A canonical lemma takes precedence over another lemma’s plural alias; this resolves the Datum/Daten collision.
semantic_corrections:
- id: V04-LEX-DATEN
  problem: v0.3 stored Datum with plural Daten; naive plural lookup can misread technical Daten (data) as dates.
  resolution: Added independent restricted lemma Daten for technical information/data. Collision-safe indexing prevents Datum
    plural alias from overriding it.
  observed_public_occurrences: 3
  industries:
  - elektrotechnik
  - maschinenbau
  - software_it
