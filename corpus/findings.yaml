limitations:
- The public corpus is stratified by document count but consists of short excerpts, not full copyrighted manuals.
- The source sample is evidence for lexical curation, not a statistically representative model of all German technical writing.
- No human technical-writing/terminology panel has yet approved the dictionary.
- Snowball morphology remains a development hint only; normative conformance requires deterministic German lemmatization and
  syntax.
- Domain nouns and verbs must remain project terminology rather than being absorbed solely to increase coverage.
