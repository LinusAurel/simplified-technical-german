name: Corpus Full-Text Audit

on:
  workflow_dispatch:
  push:
    branches:
      - v0.5/corpus-pipeline
    paths:
      - corpus/v0.5-sources.yaml
      - tools/build_corpus_v05.py
      - dictionary/**
      - requirements-dev.txt
      - .github/workflows/corpus-fulltext.yml
  pull_request:
    paths:
      - corpus/v0.5-sources.yaml
      - tools/build_corpus_v05.py
      - dictionary/**
      - requirements-dev.txt
      - .github/workflows/corpus-fulltext.yml

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build aggregate corpus metrics
        run: python tools/build_corpus_v05.py --allow-failures
      - name: Upload aggregate metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.5-fulltext-metrics
          path: corpus/v0.5-fulltext-metrics.json
          if-no-files-found: warn
          retention-days: 14
