name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/sync_skill.py --check
      - run: python tools/sync_package.py --check
      - run: python tools/validate_release.py --skip-manifest
      - run: python tools/package_skill.py --out dist

  self-check:
    # Dogfooding: the reusable action checks this repository's own German documentation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: STG-DE documentation
        uses: ./
        with:
          paths: >-
            README.md AGENTS.md CONTRIBUTING.md GOVERNANCE.md NOTICE.md RELEASE-CHECKLIST.md ROADMAP.md
            VERSIONING.md sources.md specification.md validator-contract.md rules dictionary mapping
            profiles proposals quality corpus vale evals/README.md skills/simplified-technical-german/SKILL.md
          profile: description
          fail-on: error
      - name: STG-DE prompt snippets
        uses: ./
        with:
          paths: prompts
          profile: agent
          fail-on: error
