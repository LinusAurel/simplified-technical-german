name: Clean up branches
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true lists the branches only. false deletes them."
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  delete-merged-head:
    # After a merged pull request from this repository, delete its head branch.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" \
            && echo "Deleted $BRANCH" || echo "Branch $BRANCH was already deleted"

  delete-all-merged:
    # Manual run: delete every branch that has no commits outside the default branch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete fully merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' | while read -r branch; do
            [ "$branch" = "$DEFAULT" ] && continue
            ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT...$branch" --jq '.ahead_by')
            if [ "$ahead" != "0" ]; then
              echo "Keep $branch ($ahead commits not in $DEFAULT)"
            elif [ "$DRY_RUN" = "true" ]; then
              echo "Would delete $branch"
            else
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" && echo "Deleted $branch"
            fi
          done
