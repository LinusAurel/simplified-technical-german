# STG-DE Agent Skill evaluation cases.
#
# All input texts are written for this project. Each case states machine-checkable
# expectations. `tools/run_evals.py` scores model outputs against them.
#
# Fields:
#   operation        WRITE | REWRITE | AUDIT
#   profile          application profile passed to the linter
#   input            source text (REWRITE/AUDIT) or brief (WRITE)
#   must_contain     strings that must appear verbatim in the output
#   must_not_contain strings that must not appear (case-insensitive)
#   allow_rules      linter rules that may remain (unresolvable without inventing facts)
#   expect_note      true when the output must contain a "Hinweis:" line
#   expect_unchanged true when compliant input must be returned unchanged
#   expected_rules   AUDIT: rule IDs the audit must name
#   expected_result  AUDIT: PASS | PASS WITH REVIEW | FAIL
#   anrede           form of address the linter enforces on the output (sie | du | infinitiv)
schema_version: '0.2'
cases:
- id: rewrite-procedure-housing
  operation: REWRITE
  profile: procedure
  input: >-
    Bevor man das Gehäuse öffnet, muss der Netzstecker gezogen werden; danach werden die vier
    Schrauben (M4) mit einem Kreuzschlitzschraubendreher gelöst und das Gehäuse wird nach oben abgenommen.
  must_contain: [M4, Netzstecker, Gehäuse]
  must_not_contain: [" man ", ";"]

- id: rewrite-safety-guard
  operation: REWRITE
  profile: safety
  input: >-
    WARNUNG: Die Schutzhaube darf bei laufendem Motor auf keinen Fall entfernt werden, da es sonst zu
    schweren Schnittverletzungen an den Händen kommen kann.
  must_contain: ["WARNUNG", Schutzhaube, Motor]

- id: rewrite-agent-tool-description
  operation: REWRITE
  profile: agent
  input: >-
    Dieses Tool kann genutzt werden, um Dateien im Arbeitsverzeichnis zu löschen, wobei man beachten muss,
    dass gelöschte Dateien nicht wiederhergestellt werden können und der Parameter `force` nur dann gesetzt
    werden darf, wenn der Nutzer die Löschung ausdrücklich bestätigt hat.
  must_contain: ["`force`"]
  must_not_contain: [" man "]

- id: rewrite-requirement-vague-time
  operation: REWRITE
  profile: requirement
  input: >-
    Das System soll Anfragen zeitnah beantworten und bei Fehlern und/oder Zeitüberschreitungen eine
    Meldung im Protokoll ausgeben.
  must_contain: [Protokoll]
  must_not_contain: [und/oder]
  # The source gives no measurable limit. The rewrite must not invent one.
  allow_rules: [STG-1.1]
  expect_note: true

- id: rewrite-support-password
  operation: REWRITE
  profile: support
  input: >-
    Falls Sie Ihr Passwort vergessen haben sollten, können Sie auf der Anmeldeseite einfach auf
    „Passwort vergessen“ klicken, woraufhin Ihnen dann eine E-Mail mit einem Link zugeschickt wird, der
    24 Stunden lang gültig ist.
  must_contain: ["„Passwort vergessen“", "24"]

- id: rewrite-consumer-battery
  operation: REWRITE
  profile: consumer
  input: >-
    Um eine möglichst lange Lebensdauer des Akkus zu gewährleisten, sollte das Gerät nicht dauerhaft bei
    Temperaturen über 35 °C gelagert werden und der Akku sollte vor einer längeren Lagerung auf etwa 50 %
    geladen werden.
  must_contain: ["35 °C", "50 %"]

- id: rewrite-error-message
  operation: REWRITE
  profile: agent
  input: >-
    Fehler: Die Konfiguration konnte nicht geladen werden, da die Datei `config.yaml` entweder nicht
    vorhanden ist oder ungültiges YAML enthält; bitte prüfen.
  must_contain: ["`config.yaml`"]
  must_not_contain: [";"]

- id: rewrite-consumer-keeps-du
  operation: REWRITE
  profile: consumer
  # The source addresses the reader with "du". Without a project setting the rewrite keeps it.
  anrede: du
  input: >-
    Wenn du deinen Zählerstand meldest, solltest du am besten gleich ein Foto vom Zähler mitschicken;
    so können wir den Wert schneller prüfen und du bekommst deine Abrechnung ohne Rückfragen.
  must_contain: [Zählerstand, Foto]
  must_not_contain: [" Sie ", ";"]

- id: rewrite-already-compliant
  operation: REWRITE
  profile: procedure
  input: |-
    1. Schalten Sie das Gerät aus.
    2. Ziehen Sie den Netzstecker.
    3. Warten Sie 5 Minuten.
  expect_unchanged: true

- id: write-procedure-air-filter
  operation: WRITE
  profile: procedure
  input: >-
    Schreibe eine Anleitung für den Wechsel des Luftfilters F-12. Schritte: Gerät ausschalten, Abdeckung
    öffnen (2 Clips), alten Filter entnehmen, neuen Filter F-12 einsetzen, Abdeckung schließen.
  must_contain: [F-12, "2"]
  must_not_contain: [" man "]

- id: write-description-sensor
  operation: WRITE
  profile: description
  input: >-
    Beschreibe in höchstens drei Sätzen den Temperatursensor TS-3: Messbereich -20 °C bis 120 °C,
    Genauigkeit 0,5 K, Ausgabe alle 2 Sekunden über die Schnittstelle CAN.
  must_contain: [TS-3, "120 °C", CAN]

- id: audit-violations
  operation: AUDIT
  profile: procedure
  input: >-
    Man prüft zuerst den Druck; danach wird das Ventil A und/oder B geöffnet.
  expected_rules: [STG-DE-4.3, STG-8.1, STG-DE-8.1]
  expected_result: FAIL

- id: audit-compliant
  operation: AUDIT
  profile: procedure
  input: |-
    1. Schalten Sie das Gerät aus.
    2. Prüfen Sie den Druck.
  expected_rules: []
  expected_result: PASS

# Text types from embedded, IoT, functional safety, and product security work (STG-DE 0.4).

- id: rewrite-requirement-ears-overvoltage
  operation: REWRITE
  profile: requirement
  # EARS pattern "Wenn <Auslöser>, muss <System> <Reaktion>". "ggf." hides whether the log entry is required.
  input: >-
    Bei Überspannung (> 30 V) ist durch die Steuerung sicherzustellen, dass der Ausgang innerhalb von
    max. 10 ms abgeschaltet wird und ggf. ein Fehlereintrag im Log erzeugt wird.
  must_contain: ["30 V", "10 ms", Steuerung]
  must_not_contain: [ggf.]
  expect_note: true

- id: rewrite-safety-requirement-sil
  operation: REWRITE
  profile: requirement
  input: >-
    Die Sicherheitsfunktion SF-02 (SIL 2) muss bei Erkennung eines Kanalfehlers den sicheren Zustand
    (Motor stromlos) innerhalb der Fehlertoleranzzeit von 50 ms herbeiführen, wobei ein automatischer
    Wiederanlauf nicht erfolgen darf.
  must_contain: [SF-02, SIL 2, "50 ms", nicht]

- id: rewrite-release-notes-firmware
  operation: REWRITE
  profile: description
  input: >-
    Mit der Firmware-Version 2.4.1 wurde ein Fehler behoben, durch den es bei aktivierter TLS-Verbindung
    sporadisch zu Verbindungsabbrüchen zum MQTT-Broker kommen konnte; zudem wird das Gerätezertifikat
    nun 30 Tage vor Ablauf automatisch erneuert.
  must_contain: ["2.4.1", TLS, MQTT, "30"]
  must_not_contain: [";"]

- id: rewrite-vulnerability-notice
  operation: REWRITE
  profile: safety
  # Advisory for a vulnerability handling process (CRA). "zeitnah" has no measurable meaning.
  input: >-
    Eine Schwachstelle (CVE-2026-12345, CVSS 8.1) in der Weboberfläche ermöglicht es einem nicht
    authentifizierten Angreifer im lokalen Netz, beliebige Befehle auszuführen. Betroffen sind alle
    Versionen vor 3.2.0. Es wird dringend empfohlen, zeitnah auf Version 3.2.0 zu aktualisieren.
  must_contain: [CVE-2026-12345, "8.1", "3.2.0"]
  must_not_contain: [zeitnah]

- id: rewrite-test-instruction-insulation
  operation: REWRITE
  profile: procedure
  input: >-
    Zur Prüfung des Isolationswiderstands wird zwischen L/N und PE eine Prüfspannung von 500 V DC
    angelegt; der gemessene Wert muss größer als 2 MΩ sein, andernfalls ist die Baugruppe als
    fehlerhaft zu kennzeichnen und auszusortieren.
  must_contain: ["500 V", "2 MΩ", PE]
  must_not_contain: [";"]

- id: write-procedure-firmware-update
  operation: WRITE
  profile: procedure
  input: >-
    Schreibe eine Anleitung für das Firmware-Update des Gateways GW-200 über die Weboberfläche:
    Datei fw-2.4.1.bin herunterladen, im Menü „System > Update“ die Datei auswählen, auf „Installieren“
    klicken. Das Gateway darf während des Updates nicht von der Stromversorgung getrennt werden. Das
    Update ist fertig, wenn die LED STATUS grün leuchtet (nach ungefähr 3 Minuten).
  must_contain: [GW-200, fw-2.4.1.bin, "„System > Update“", "„Installieren“", STATUS, "3"]
  must_not_contain: [" man "]

- id: audit-requirement-iot
  operation: AUDIT
  profile: requirement
  input: >-
    Das Gateway soll Telemetriedaten zeitnah an die Cloud übertragen; bei Verbindungsverlust werden die
    Daten ggf. lokal gepuffert.
  expected_rules: [STG-1.1, STG-8.1]
  expected_result: FAIL
